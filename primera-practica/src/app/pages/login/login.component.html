
<mat-card appearance="outlined">
    <mat-card-header>
        <h1>{{ 'LOGIN.TITULO' | translate }}</h1>
    </mat-card-header>
    <mat-card-content>
        <form action="login">
            <mat-form-field>
                <mat-label>{{ 'LOGIN.EMAIL' | translate }}</mat-label>
                <input matInput type="text">
            </mat-form-field>
            <mat-form-field>
                <mat-label>{{ 'LOGIN.PASSWORD' | translate }}</mat-label>
                <input matInput type="password">
            </mat-form-field>
        </form>
        <section>
            <button mat-flat-button (click)="login()">{{ 'LOGIN.BUTTON' | translate }}</button>
        </section>
    </mat-card-content>
</mat-card>
